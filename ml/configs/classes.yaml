# 학습할 클래스 정의 — aihub_make_dataset.py가 읽는다.
#
# - 순서가 곧 클래스 번호다 (0부터). 순서를 바꾸면 이전에 학습한 모델과 번호가 달라진다.
# - match: AI Hub _meta.xml의 분류 필드(div_l 대 / div_m 중 / div_s 소)와 값.
#   적힌 조건을 모두 만족하는 상품이 이 클래스가 되고, 위에서부터 먼저 맞는 클래스를 쓴다.
# - 어느 클래스에도 안 맞는 상품은 데이터셋에서 빠진다.
# - 이름은 영어로 둔다 (Ultralytics가 한글 이름이면 그래프용 글꼴을 따로 내려받는다). 앱에서 한글로 바꿔 보여 준다.
#
# div_l(대분류)을 안 적은 건 일부러다: 음료 묶음에도 div_m이 '우유'인 상품이 있어서, 그것도 milk로 모으기 위해.

classes:
  - name: milk      # 우유 (일반·가공)
    match: {div_m: 우유}
  - name: yogurt    # 요구르트 (마시는·떠먹는)
    match: {div_m: 요구르트}
  - name: cheese    # 치즈
    match: {div_m: 치즈}
  - name: butter    # 버터·마가린
    match: {div_m: 버터}
